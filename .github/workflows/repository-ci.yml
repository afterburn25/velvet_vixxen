  operations-recovery:
    name: Operations restore (${{ matrix.engine }}, PHP ${{ matrix.php }})
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        engine: [mysql-8.0, mariadb-10.11]
        include:
          - engine: mysql-8.0
            image: mysql:8.0
            client: mysql
            health: mysqladmin ping --silent
          - engine: mariadb-10.11
            image: mariadb:10.11
            client: mariadb
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: velvet_root_fixture
          MARIADB_ROOT_PASSWORD: velvet_root_fixture
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      VVX_OPERATIONS_CI_NAME: vvx-operations-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/operations
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, fileinfo, mbstring, openssl, gd, zip, sodium, dom, posix
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retained HTTP and browser dependencies
        run: |
          python -m pip install requests beautifulsoup4 pillow==11.3.0 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check owned Operations fixture guards
        run: php tests/Feature/operations_ci_fixture.php
      - name: Prepare new private source and restore fixture
        env:
          VVX_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          umask 077
          VVX_OPERATIONS_CI_DIR="$RUNNER_TEMP/$VVX_OPERATIONS_CI_NAME"
          php tests/Database/operations_ci_fixture.php prepare "$VVX_OPERATIONS_CI_DIR" "$VVX_ENGINE" 3306
          printf 'VVX_OPERATIONS_CI_DIR=%s\n' "$VVX_OPERATIONS_CI_DIR" >> "$GITHUB_ENV"
      - name: Provision only this disposable service's new fixture pair
        env:
          VVX_SERVICE: ${{ job.services.database.id }}
          VVX_IMAGE: ${{ matrix.image }}
          VVX_CLIENT: ${{ matrix.client }}
          MYSQL_PWD: velvet_root_fixture
        run: |
          set -euo pipefail
          umask 077
          test -n "$VVX_SERVICE"
          test "$(docker inspect --format '{{.Config.Image}}' "$VVX_SERVICE")" = "$VVX_IMAGE"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$VVX_SERVICE")" = healthy
          if ! docker exec -i -e MYSQL_PWD "$VVX_SERVICE" "$VVX_CLIENT" --no-defaults -uroot --batch \
              < "$VVX_OPERATIONS_CI_DIR/provision.sql" \
              > "$VVX_OPERATIONS_CI_DIR/provision-client.log" 2>&1; then
            echo 'Disposable Operations provisioning failed; private SQL and client output were preserved outside artifacts.' >&2
            exit 1
          fi
      - name: Verify actual engine and exact empty fixture pair
        run: |
          set -euo pipefail
          mkdir -p "$VELVET_SCREENSHOT_DIR"
          php tests/Database/operations_ci_fixture.php verify "$VVX_OPERATIONS_CI_DIR" \
            > "$VELVET_SCREENSHOT_DIR/database-provisioning.json"
      - name: Actual SQL encrypted backup and isolated restore
        run: |
          set -euo pipefail
          source "$VVX_OPERATIONS_CI_DIR/source.env"
          php tests/Database/operations_mysql.php
          php tests/Database/operations_ci_fixture.php verify "$VVX_OPERATIONS_CI_DIR" \
            > "$VELVET_SCREENSHOT_DIR/database-after-source.json"
      - name: Actual packaged Operations HTTP acceptance
        run: |
          set -euo pipefail
          source "$VVX_OPERATIONS_CI_DIR/source.env"
          python tests/Http/operations_http.py --mode both
          php tests/Database/operations_ci_fixture.php verify "$VVX_OPERATIONS_CI_DIR" \
            > "$VELVET_SCREENSHOT_DIR/database-after-http.json"
      - name: Actual packaged Operations desktop and mobile acceptance
        run: |
          set -euo pipefail
          source "$VVX_OPERATIONS_CI_DIR/source.env"
          python tests/Browser/operations_playwright.py --mode both
          php tests/Database/operations_ci_fixture.php verify "$VVX_OPERATIONS_CI_DIR" \
            > "$VELVET_SCREENSHOT_DIR/database-after-browser.json"
      - name: Upload actual Operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-${{ matrix.engine }}-php${{ matrix.php }}-evidence
          path: artifacts/operations/
          if-no-files-found: error

  privacy-access-runtime:
    name: Privacy and access / ${{ matrix.feature }} / ${{ matrix.engine }}
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [member_privacy, age_policies]
        engine: [mysql-8.0, mariadb-10.11]
        include:
          - engine: mysql-8.0
            image: mysql:8.0
            health: mysqladmin ping --silent
          - engine: mariadb-10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: velvet_privacy_test
          MYSQL_USER: velvet_test
          MYSQL_PASSWORD: velvet_test_fixture
          MYSQL_ROOT_PASSWORD: velvet_root_fixture
          MARIADB_DATABASE: velvet_privacy_test
          MARIADB_USER: velvet_test
          MARIADB_PASSWORD: velvet_test_fixture
          MARIADB_ROOT_PASSWORD: velvet_root_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      VELVET_TEST_DB_ENGINE: ${{ matrix.engine }}
      VELVET_TEST_DB_HOST: 127.0.0.1
      VELVET_TEST_DB_PORT: '3306'
      VELVET_TEST_DB_NAME: velvet_privacy_test
      VELVET_TEST_DB_USER: velvet_test
      VELVET_TEST_DB_PASSWORD: velvet_test_fixture
      VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/privacy-access
      VELVET_APACHE_BINARY: /usr/sbin/apache2
      VELVET_APACHE_MODULES: /usr/lib/apache2/modules
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, mbstring, openssl, gd, zip, sodium, dom
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Apache and matching PHP handler with pinned browser tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends apache2-bin libapache2-mod-php8.3
          sudo systemctl stop apache2
          python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pillow==11.3.0 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify complete member inventory and atomic core closure on the actual engine
        if: matrix.feature == 'member_privacy'
        run: php tests/Feature/member_privacy_store.php --mysql
      - name: Verify configured policy or reviewed privacy boundaries on the actual engine
        run: php tests/Feature/${{ matrix.feature }}.php --mysql
      - name: Verify actual file and SQL Apache root and nested request boundaries
        run: python tests/Http/${{ matrix.feature }}_http.py --mode both
      - name: Review actual desktop and mobile workflows including no JavaScript
        run: python tests/Browser/${{ matrix.feature }}_playwright.py --mode both
      - name: Upload actual privacy and access acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-access-${{ matrix.feature }}-${{ matrix.engine }}-evidence
          path: artifacts/privacy-access/
          if-no-files-found: error
          retention-days: 14

  runtime-packages:
    name: Build verified fresh-install and upgrade ZIPs
    needs: [source-tests, mysql-migrations, http-browser, safeguards-browser, accessibility, mariadb-compatibility, protection-runtime, operations-recovery, privacy-access-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build separate runtime packages
        run: python scripts/package.py --output artifacts/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: velvet-vixxen-runtime-packages
          path: artifacts/runtime/
          if-no-files-found: error
          retention-days: 30
