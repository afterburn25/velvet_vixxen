          set -euo pipefail
          required=(README.md AGENTS.md PROJECT_STATUS.md SESSION_HANDOFF.md CHANGELOG.md
            docs/ROADMAP.md docs/DECISIONS.md docs/TESTING.md docs/TEST_REPORT.md
