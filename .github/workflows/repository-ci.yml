name: Repository and Source CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and its PR share one complete gate run. Forks and main stay separate.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository and executable source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require documentation and executable source
        shell: bash
