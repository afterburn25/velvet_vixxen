name: Repository and Source CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and its PR share one complete gate run. Forks and main stay separate.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository and executable source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require documentation and executable source
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md AGENTS.md PROJECT_STATUS.md SESSION_HANDOFF.md CHANGELOG.md
            docs/ROADMAP.md docs/DECISIONS.md docs/TESTING.md docs/TEST_REPORT.md
            docs/SESSION_PROTOCOL.md SECURITY.md CONTRIBUTING.md VERSION
            app/bootstrap.php public/router.php install/index.php
            scripts/test.sh scripts/test_http.sh scripts/package.py
            tests/Database/migrations_mysql.php tests/Database/database_update_scenarios.php tests/Database/merchandise_scenarios.php
            tests/Database/booking_form_scenarios.php tests/Browser/composer_recovery_playwright.py
            tests/Browser/merchandise_playwright.py tests/Browser/booking_form_playwright.py
            app/Core/MigrationResumeSchema.php tests/Installer/database_fixture.php
            tests/Installer/existing_database_mysql.php tests/Installer/browser_database_fixture.php
            tests/Installer/migration_resume_mysql_scenarios.php
            tests/Browser/installer_existing_database_playwright.py
            route.php app/Support/public_routes.php public/routes/api/upload.php public/routes/api/scene.php
            app/Core/SceneButton.php public/assets/js/api-client.js
            tests/Unit/api_client.js tests/Unit/installation_urls.php tests/Feature/scene_buttons.php
            app/Views/public/partials/scene-buttons.php tests/Feature/scene_group_buttons.php
            tests/Browser/composer_group_buttons_playwright.py app/Core/CampaignDeliveryService.php
            app/Core/MailDeliveryException.php tests/Feature/campaign_delivery.php
            tests/Http/campaign_delivery_http.py tests/Http/campaign_delivery_fixture.php
            tests/Browser/campaign_delivery_playwright.py
            tests/Http/private_reply_email_http.py tests/Http/private_reply_email_fixture.php
            app/Core/MarketingAudience.php app/Views/admin/marketing-audiences.php
            app/Views/admin/marketing-campaign-form.php tests/Feature/marketing_audiences.php
            tests/Http/marketing_audiences_http.py tests/Http/marketing_audiences_fixture.php
            tests/Browser/marketing_audiences_playwright.py docs/NEWSLETTER_AUDIENCES.md
            app/Core/MarketingPublication.php app/Views/admin/marketing-publication-editor.php
            app/Views/admin/marketing-publication-list.php tests/Feature/publication_windows.php
            tests/Http/publication_windows_http.py tests/Http/publication_windows_fixture.php
            tests/Browser/publication_windows_playwright.py docs/PUBLICATION_WINDOWS.md
            app/Core/MarketingStorage.php app/Core/MarketingSqlRepository.php app/Core/MarketingStorageException.php
            database/migrations/202610200015_marketing_sql_storage.php
            app/Support/marketing_storage_admin.php app/Views/admin/marketing-storage.php
            app/Views/admin/marketing-storage-actions.php docs/MARKETING_STORAGE.md
            tests/Feature/marketing_storage.php tests/Database/marketing_sql_mysql.php tests/Database/marketing_sql_worker.php
            tests/Http/marketing_storage_fixture.php tests/Http/marketing_storage_http.py
            tests/Browser/marketing_storage_playwright.py
            app/Core/MarketingAccess.php app/Views/admin/marketing-preview.php docs/EDITORIAL_ACCESS.md
            tests/Feature/editorial_access.php tests/Http/editorial_access_fixture.php
            tests/Http/editorial_access_http.py tests/Browser/editorial_access_playwright.py
            app/Core/MarketingMetadata.php docs/EDITORIAL_METADATA.md
            tests/Feature/editorial_metadata.php tests/Http/editorial_metadata_fixture.php
            tests/Http/editorial_metadata_http.py tests/Browser/editorial_metadata_playwright.py
            app/Core/EmailAddress.php app/Core/MailSettingsService.php app/Support/mail_settings_admin.php
            app/Views/admin/mail-settings.php app/Views/admin/mail-settings-actions.php
            public/assets/js/mail-settings.js public/assets/css/mail-settings.css
            tests/Installer/mail_validation.php tests/Installer/mail_smtp_capture.py tests/Feature/mail_settings.php
            tests/Http/mail_settings_http.py tests/Http/mail_settings_fixture.php tests/Browser/mail_settings_playwright.py
            app/Core/MediaInput.php app/Support/media_admin.php app/Console/run_media.php
            public/assets/css/media-admin-edit.css tests/Feature/media_center_persistence.php
            tests/Database/media_center_mysql.php tests/Http/media_center_http.py tests/Http/media_center_fixture.php
            tests/Browser/media_center_persistence_playwright.py
            admin/addon-recovery.php app/Core/AddonMigrationPlan.php app/Core/AddonMigrationRecovery.php
            app/Core/AddonMigrationException.php tests/Database/addon_migrations_mysql.php
            tests/Database/addon_lifecycle_worker.php tests/Http/addon_recovery_fixture.php
            tests/Http/addon_recovery_http.py tests/Browser/addon_recovery_browser.py
            tests/Packaging/release_version.py tests/Packaging/fixtures/release-0.8.2-build-20261020.3.json
            tests/Packaging/fixtures/release-0.8.3-build-20261020.4.json
            tests/Packaging/fixtures/release-0.8.4-build-20261020.5.json
            tests/Packaging/fixtures/release-0.8.5-build-20261020.6.json
            tests/Packaging/fixtures/release-0.8.6-build-20261020.7.json
            tests/Packaging/fixtures/release-0.8.7-build-20261020.8.json
            tests/Packaging/fixtures/installer-mail-baseline.json
            tests/Browser/composer_buttons_playwright.py tests/Browser/packaged_media_upload_playwright.py
            tests/Browser/composer_actions_playwright.py tests/Structure/public_routes.php tests/Http/public_routes_packaged.py
            tests/Browser/installed_update_playwright.py tests/Feature/runtime_build.php
            admin/update.php app/Core/RuntimeBuildService.php app/Views/admin/update-status.php
            admin/repair.php app/Core/RuntimeInventoryService.php app/Core/RootLayoutService.php
            app/Views/admin/repair-status.php tests/Feature/root_layout.php
            tests/Fixtures/root-layout-build5.json tests/Packaging/fixtures/historical-runtime-layouts.json
            public/routes/account/login.php public/routes/booking/index.php)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required source or handoff file: $file"; exit 1; }
          done
          grep -q 'afterburn25/velvet_vixxen' PROJECT_STATUS.md
          grep -Eq '12(-character| or more characters)' docs/DECISIONS.md
          grep -Eq 'single (simplified )?responsive browser page' docs/DECISIONS.md

  source-tests:
    name: PHP ${{ matrix.php }} source and package regressions
    needs: repository-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, fileinfo, mbstring, openssl, gd, zip, sodium, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mandatory source and packaging suites in disposable copies
        run: bash scripts/test.sh

  mysql-migrations:
    name: MySQL 8 / PHP ${{ matrix.php }} installer resume, upgrades and transactions
    needs: repository-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        # These credentials are disposable CI fixtures, never production secrets.
        env:
          MYSQL_DATABASE: velvet_vixxen_test
          MYSQL_USER: velvet_test
          MYSQL_PASSWORD: velvet_test_fixture
          MYSQL_ROOT_PASSWORD: velvet_root_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, openssl, sodium, zip, gd
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify migrations, installed upgrade preservation, merchandise and booking transactions, then roll back
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/migrations_mysql.php
      - name: Verify real packaged installer on existing and interrupted MySQL databases
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Installer/existing_database_mysql.php
      - name: Permit failure-injection triggers in the disposable MySQL service
        # Only test fixtures create triggers; application connections retain their schema-scoped user.
        env:
          VVX_MYSQL_SERVICE: ${{ job.services.mysql.id }}
          VVX_MYSQL_ROOT_PASSWORD: velvet_root_fixture
        run: |
          set -euo pipefail
          test -n "$VVX_MYSQL_SERVICE"
          fixture_setting="$(docker exec -e MYSQL_PWD="$VVX_MYSQL_ROOT_PASSWORD" "$VVX_MYSQL_SERVICE" mysql -uroot --batch --skip-column-names --execute='SET GLOBAL log_bin_trust_function_creators = 1; SELECT @@GLOBAL.log_bin_trust_function_creators;')"
          test "$fixture_setting" = '1'
      - name: Apply, roll back and recover actual packaged add-on migrations in MySQL
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/addon_migrations_mysql.php

      - name: Preserve marketing records through an actual packaged MySQL move and concurrent delivery
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/marketing_sql_mysql.php

      - name: Install packaged HTTP acceptance dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Enforce editorial access and saved-owner previews through actual packaged MySQL requests
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: python tests/Http/editorial_access_http.py --mode mysql
      - name: Save editorial metadata and enforce related-content and image privacy through packaged MySQL requests
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: python tests/Http/editorial_metadata_http.py --mode mysql

  http-browser:
    name: Installed HTTP and Chromium desktop/mobile acceptance
    needs: repository-contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        # This schema belongs only to the disposable real-installer browser fixture.
        env:
          MYSQL_DATABASE: velvet_installer_http_test
          MYSQL_USER: velvet_test
          MYSQL_PASSWORD: velvet_test_fixture
          MYSQL_ROOT_PASSWORD: velvet_root_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          # Rebuild the exact previously delivered runtime for a real warm-cache upgrade.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, mbstring, openssl, gd, zip, sodium
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Install and resume existing MySQL databases through the real desktop and mobile browser form
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/installer_existing_database_playwright.py
      - name: Verify packaged media uploads without rewrite assistance at root and nested paths
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/packaged_media_upload_playwright.py
      - name: Repair the rejected Build .5 root layout in the same browser and persistent PHP cache
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/installed_update_playwright.py
      - name: Verify every packaged public route and cleanup preservation without rewrite assistance
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Http/public_routes_packaged.py
      - name: Run installed HTTP suites in a disposable copy
        run: bash scripts/test_http.sh
      - name: Keep private replies out of actual member and guest notification emails
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Http/private_reply_email_http.py
      - name: Verify packaged preview, publish and button destinations without rewrite assistance
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/composer_actions_playwright.py
      - name: Edit and publish grouped Hero and Footer buttons in real packaged desktop and mobile pages
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/composer_group_buttons_playwright.py
      - name: Use the real Campaign owner controls and independent public switches on desktop and mobile
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/campaign_delivery_playwright.py
      - name: Create and preview newsletter audiences through real packaged desktop and nested mobile owner pages
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/marketing_audiences_playwright.py
      - name: Configure email and test saved SMTP settings through the real packaged owner page
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/mail_settings_playwright.py
      - name: Run real desktop and mobile browser suites in a disposable copy
        env:
          VELVET_BROWSER_TESTS: '1'
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: bash scripts/test_http.sh
      - name: Persist gallery edits and scheduled playlists through actual file and MySQL customer packages
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/media_center_persistence_playwright.py
      - name: Permit failure-injection triggers in the disposable MySQL service
        # Only test fixtures create triggers; application connections retain their schema-scoped user.
        env:
          VVX_MYSQL_SERVICE: ${{ job.services.mysql.id }}
          VVX_MYSQL_ROOT_PASSWORD: velvet_root_fixture
        run: |
          set -euo pipefail
          test -n "$VVX_MYSQL_SERVICE"
          fixture_setting="$(docker exec -e MYSQL_PWD="$VVX_MYSQL_ROOT_PASSWORD" "$VVX_MYSQL_SERVICE" mysql -uroot --batch --skip-column-names --execute='SET GLOBAL log_bin_trust_function_creators = 1; SELECT @@GLOBAL.log_bin_trust_function_creators;')"
          test "$fixture_setting" = '1'
      - name: Recover a held add-on through the actual desktop and mobile owner controls
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_TEST_PYTHON: python
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: php tests/Database/addon_migrations_mysql.php --browser
      - name: Edit publication windows through actual packaged owner and public pages
        env:
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/publication_windows_playwright.py
      - name: Review and move marketing storage through actual packaged desktop and nested mobile owner pages
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/marketing_storage_playwright.py
      - name: Apply editorial access and preview saved content through actual file and MySQL desktop and mobile packages
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/editorial_access_playwright.py
      - name: Edit and render editorial metadata through actual file and MySQL desktop and mobile packages
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_installer_http_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
          VELVET_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/browser
        run: python tests/Browser/editorial_metadata_playwright.py
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-browser-evidence
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14

  runtime-packages:
    name: Build verified fresh-install and upgrade ZIPs
    needs: [source-tests, mysql-migrations, http-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build separate runtime packages
        run: python scripts/package.py --output artifacts/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: velvet-vixxen-runtime-packages
          path: artifacts/runtime/
          if-no-files-found: error
          retention-days: 30
