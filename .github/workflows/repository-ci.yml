          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: python tests/Http/menus_http.py --mode mysql
      - name: Preserve per-device scene depth and foreground masking through actual packaged MySQL requests
        env:
