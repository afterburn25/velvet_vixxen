  source-tests:
    name: PHP ${{ matrix.php }} source and package regressions
    needs: repository-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, fileinfo, mbstring, openssl, gd, zip, sodium, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mandatory source and packaging suites in disposable copies
        run: bash scripts/test.sh

  mysql-migrations:
    name: MySQL 8 / PHP ${{ matrix.php }} installer resume, upgrades and transactions
    needs: repository-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        # These credentials are disposable CI fixtures, never production secrets.
        env:
          MYSQL_DATABASE: velvet_vixxen_test
          MYSQL_USER: velvet_test
          MYSQL_PASSWORD: velvet_test_fixture
          MYSQL_ROOT_PASSWORD: velvet_root_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, openssl, sodium, zip, gd
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify migrations, installed upgrade preservation, merchandise and booking transactions, then roll back
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/migrations_mysql.php
      - name: Verify real packaged installer on existing and interrupted MySQL databases
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Installer/existing_database_mysql.php
      - name: Permit failure-injection triggers in the disposable MySQL service
        # Only test fixtures create triggers; application connections retain their schema-scoped user.
        env:
          VVX_MYSQL_SERVICE: ${{ job.services.mysql.id }}
          VVX_MYSQL_ROOT_PASSWORD: velvet_root_fixture
        run: |
          set -euo pipefail
          test -n "$VVX_MYSQL_SERVICE"
          fixture_setting="$(docker exec -e MYSQL_PWD="$VVX_MYSQL_ROOT_PASSWORD" "$VVX_MYSQL_SERVICE" mysql -uroot --batch --skip-column-names --execute='SET GLOBAL log_bin_trust_function_creators = 1; SELECT @@GLOBAL.log_bin_trust_function_creators;')"
          test "$fixture_setting" = '1'
      - name: Apply, roll back and recover actual packaged add-on migrations in MySQL
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/addon_migrations_mysql.php

      - name: Preserve marketing records through an actual packaged MySQL move and concurrent delivery
        env:
          VELVET_TEST_DB_HOST: 127.0.0.1
          VELVET_TEST_DB_PORT: '3306'
          VELVET_TEST_DB_NAME: velvet_vixxen_test
          VELVET_TEST_DB_USER: velvet_test
          VELVET_TEST_DB_PASSWORD: velvet_test_fixture
        run: php tests/Database/marketing_sql_mysql.php

      - name: Install packaged HTTP acceptance dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Enforce editorial access and saved-owner previews through actual packaged MySQL requests
